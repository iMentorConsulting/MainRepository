[build]
builder = "NIXPACKS"

[deploy]
startCommand = "sh start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production.variables]
NODE_ENV = "production"
HOSTNAME = "0.0.0.0"

[services.splendid-friendship.deploy]
startCommand = "curl -s -X POST https://logistis.i-mentor.gr/api/cron/process-gemi-emails -H \"Authorization: Bearer $CRON_SECRET\""
restartPolicyType = "NEVER"
